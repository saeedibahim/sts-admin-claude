    <script>
        let allBudgets = [];
        let budgetModal;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            budgetModal = new bootstrap.Modal(document.getElementById('budgetModal'));
            
            // Set default dates to current month
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            document.getElementById('budgetStartDate').valueAsDate = firstDay;
            document.getElementById('budgetEndDate').valueAsDate = lastDay;
            
            await loadCategories();
            await loadBudgets();
        });

        // Load categories
        async function loadCategories() {
            try {
                const categories = await fetchCategories();
                const select = document.getElementById('budgetCategory');
                
                let html = '<option value="">Select category...</option>';
                categories.forEach(cat => {
                    html += `<option value="${cat.id}">${cat.name}</option>`;
                });
                
                select.innerHTML = html;
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Load budgets
        async function loadBudgets() {
            try {
                showLoading(document.getElementById('budgetsContainer'));
                
                allBudgets = await fetchBudgets({ active_only: 1 });
                updateQuickStats(allBudgets);
                displayBudgets(allBudgets);
            } catch (error) {
                console.error('Error loading budgets:', error);
                showEmptyState(
                    document.getElementById('budgetsContainer'),
                    'exclamation-triangle',
                    'Error Loading Budgets',
                    'Please try again later'
                );
            }
        }

        // Update quick stats
        function updateQuickStats(budgets) {
            const total = budgets.length;
            const active = budgets.filter(b => b.status === 'Active').length;
            const exceeded = budgets.filter(b => b.is_exceeded).length;
            const warning = budgets.filter(b => b.is_warning && !b.is_exceeded).length;
            
            document.getElementById('totalBudgets').textContent = total;
            document.getElementById('activeBudgets').textContent = active;
            document.getElementById('exceededBudgets').textContent = exceeded;
            document.getElementById('warningBudgets').textContent = warning;
        }

       // Display budgets
function displayBudgets(budgets) {
    const container = document.getElementById('budgetsContainer');
    
    if (!budgets || budgets.length === 0) {
        showEmptyState(
            container,
            'piggy-bank',
            'No Budgets Found',
            'Create your first budget to track spending',
            '<button class="btn btn-accent" onclick="openAddBudgetModal()"><i class="bi bi-plus-lg"></i> Create Budget</button>'
        );
        return;
    }

    let html = '<div class="row">';

    budgets.forEach(budget => {
        // Safe defaults for missing values
        const spentPercentage = budget.spent_percentage || 0;
        const spentAmount = budget.spent_amount || 0;
        const remainingAmount = budget.remaining_amount || budget.amount || 0;
        const isExceeded = budget.is_exceeded || false;
        
        const status = getBudgetStatus(spentPercentage, isExceeded);
        const percentage = Math.min(spentPercentage, 100);
        
        html += `
            <div class="col-md-6 mb-4">
                <div class="budget-card">
                    <div class="budget-header">
                        <div class="budget-info">
                            <h5>${budget.name}</h5>
                            <span class="budget-type">${budget.budget_type}</span>
                            ${budget.category_name ? `
                                <span class="category-badge mt-2" style="background: ${budget.category_color}20; color: ${budget.category_color};">
                                    ${budget.category_name}
                                </span>
                            ` : ''}
                        </div>
                        <div class="budget-amounts">
                            <div class="budget-spent">${formatCurrency(spentAmount)}</div>
                            <div class="budget-total">of ${formatCurrency(budget.amount)}</div>
                        </div>
                    </div>

                    <div class="budget-progress-wrapper">
                        <div class="budget-progress">
                            <div class="budget-progress-bar ${status.class}" style="width: ${percentage}%"></div>
                        </div>
                    </div>

                    <div class="budget-stats">
                        <span class="budget-percentage ${status.class}">
                            ${spentPercentage.toFixed(1)}% used
                        </span>
                        <span class="budget-remaining">
                            ${formatCurrency(remainingAmount)} remaining
                        </span>
                    </div>

                    <div class="mt-3 pt-3" style="border-top: 1px solid var(--border-color);">
                        <div class="d-flex justify-content-between align-items-center text-muted small">
                            <span>
                                <i class="bi bi-calendar"></i>
                                ${formatDate(budget.period_start)} - ${formatDate(budget.period_end)}
                            </span>
                            <div class="action-buttons">
                                <button class="btn btn-icon btn-edit" onclick="editBudget(${budget.id})" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-icon btn-delete" onclick="deleteBudgetConfirm(${budget.id}, '${budget.name}')" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

        // Apply filters
        function applyFilters() {
            let filtered = [...allBudgets];
            
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;
            
            if (type) {
                filtered = filtered.filter(b => b.budget_type === type);
            }
            
            if (status) {
                filtered = filtered.filter(b => b.status === status);
            }
            
            updateQuickStats(filtered);
            displayBudgets(filtered);
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('typeFilter').value = '';
            document.getElementById('statusFilter').value = '';
            updateQuickStats(allBudgets);
            displayBudgets(allBudgets);
        }

        // Handle budget type change
        function handleBudgetTypeChange() {
            const type = document.getElementById('budgetType').value;
            const categoryRow = document.getElementById('categoryRow');
            
            if (type === 'Category') {
                categoryRow.style.display = 'block';
                document.getElementById('budgetCategory').required = true;
            } else {
                categoryRow.style.display = 'none';
                document.getElementById('budgetCategory').required = false;
            }
        }

        // Open add budget modal
        function openAddBudgetModal() {
            document.getElementById('budgetModalTitle').textContent = 'Create Budget';
            document.getElementById('budgetForm').reset();
            document.getElementById('budgetId').value = '';
            
            // Set defaults
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            document.getElementById('budgetStartDate').valueAsDate = firstDay;
            document.getElementById('budgetEndDate').valueAsDate = lastDay;
            document.getElementById('budgetThreshold').value = 80;
            document.getElementById('categoryRow').style.display = 'none';
            
            budgetModal.show();
        }

        // Edit budget
        async function editBudget(id) {
            try {
                const budget = allBudgets.find(b => b.id === id);
                
                if (budget) {
                    document.getElementById('budgetModalTitle').textContent = 'Edit Budget';
                    document.getElementById('budgetId').value = budget.id;
                    document.getElementById('budgetName').value = budget.name;
                    document.getElementById('budgetType').value = budget.budget_type;
                    document.getElementById('budgetAmount').value = budget.amount;
                    document.getElementById('budgetStartDate').value = budget.period_start;
                    document.getElementById('budgetEndDate').value = budget.period_end;
                    document.getElementById('budgetThreshold').value = budget.alert_threshold;
                    document.getElementById('budgetStatus').value = budget.status;
                    document.getElementById('budgetNotes').value = budget.notes || '';
                    
                    if (budget.budget_type === 'Category') {
                        document.getElementById('categoryRow').style.display = 'block';
                        document.getElementById('budgetCategory').value = budget.category_id || '';
                    }
                    
                    budgetModal.show();
                }
            } catch (error) {
                console.error('Error loading budget:', error);
                showNotification('Error loading budget', 'error');
            }
        }

        // Save budget
        async function saveBudget() {
            const form = document.getElementById('budgetForm');

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const budgetData = {
                name: document.getElementById('budgetName').value,
                budget_type: document.getElementById('budgetType').value,
                amount: parseFloat(document.getElementById('budgetAmount').value),
                period_start: document.getElementById('budgetStartDate').value,
                period_end: document.getElementById('budgetEndDate').value,
                alert_threshold: parseInt(document.getElementById('budgetThreshold').value),
                alert_enabled: 1,
                status: document.getElementById('budgetStatus').value,
                notes: document.getElementById('budgetNotes').value
            };

            if (budgetData.budget_type === 'Category') {
                budgetData.category_id = document.getElementById('budgetCategory').value || null;
            }

            const budgetId = document.getElementById('budgetId').value;

            try {
                console.log('Sending budget data:', budgetData); // DEBUG

                const response = await fetch('/api/budgets.php', {
                    method: budgetId ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(budgetId ? { id: budgetId, ...budgetData } : budgetData)
                });

                console.log('Response status:', response.status); // DEBUG

                // Get response as text first
                const responseText = await response.text();
                console.log('Response text:', responseText); // DEBUG

                // Try to parse as JSON
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    console.error('JSON Parse Error. Response was:', responseText);
                    showNotification('Error: Server returned invalid response', 'error');
                    return;
                }

                if (result.success) {
                    showNotification(budgetId ? 'Budget updated successfully' : 'Budget created successfully', 'success');
                    budgetModal.hide();
                    loadBudgets();
                } else {
                    showNotification(result.message || 'Operation failed', 'error');
                }
            } catch (error) {
                console.error('Error saving budget:', error);
                showNotification('Error saving budget: ' + error.message, 'error');
            }
        }

        // Delete budget
        async function deleteBudgetConfirm(id, name) {
            if (confirmDelete(name)) {
                try {
                    const response = await fetch('/api/budgets.php', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        showNotification('Budget deleted successfully', 'success');
                        loadBudgets();
                    } else {
                        showNotification(result.message || 'Delete failed', 'error');
                    }
                } catch (error) {
                    console.error('Error deleting budget:', error);
                    showNotification('Error deleting budget', 'error');
                }
            }
        }
    </script>
