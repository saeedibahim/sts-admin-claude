    <script>
        let allExpenses = [];
        let expenseModal;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            expenseModal = new bootstrap.Modal(document.getElementById('expenseModal'));
            
            // Set default date to today
            document.getElementById('expenseDate').valueAsDate = new Date();
            
            // Set date filters to current month
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            document.getElementById('startDateFilter').valueAsDate = firstDay;
            document.getElementById('endDateFilter').valueAsDate = lastDay;
            
            // Load data
            await loadCategories();
            await loadExpenses();
            
            // Setup search with debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => applyFilters(), 500);
            });
        });

        // Load categories
        async function loadCategories() {
            try {
                const categories = await fetchCategories();
                
                const categorySelect = document.getElementById('expenseCategory');
                const categoryFilter = document.getElementById('categoryFilter');
                
                let optionsHTML = '<option value="">Select category...</option>';
                let filterHTML = '<option value="">All Categories</option>';
                
                categories.forEach(cat => {
                    optionsHTML += `<option value="${cat.id}">${cat.name}</option>`;
                    filterHTML += `<option value="${cat.id}">${cat.name}</option>`;
                });
                
                categorySelect.innerHTML = optionsHTML;
                categoryFilter.innerHTML = filterHTML;
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Load expenses
        async function loadExpenses() {
            try {
                showLoading(document.getElementById('expensesTableContainer'));
                
                const filters = {
                    action: 'list',
                    start_date: document.getElementById('startDateFilter').value,
                    end_date: document.getElementById('endDateFilter').value
                };
                
                allExpenses = await fetchExpenses(filters);
                updateQuickStats(allExpenses);
                displayExpenses(allExpenses);
            } catch (error) {
                console.error('Error loading expenses:', error);
                showEmptyState(
                    document.getElementById('expensesTableContainer'),
                    'exclamation-triangle',
                    'Error Loading Expenses',
                    'Please try again later'
                );
            }
        }

        // Update quick stats
        function updateQuickStats(expenses) {
            const total = expenses.reduce((sum, exp) => sum + parseFloat(exp.amount), 0);
            const count = expenses.length;
            const avg = count > 0 ? total / count : 0;
            const pending = expenses.filter(exp => exp.status === 'Pending').length;
            
            document.getElementById('quickTotal').textContent = formatCurrency(total);
            document.getElementById('quickCount').textContent = count;
            document.getElementById('quickAvg').textContent = formatCurrency(avg);
            document.getElementById('quickPending').textContent = pending;
        }

        // Display expenses
        function displayExpenses(expenses) {
            const container = document.getElementById('expensesTableContainer');
            
            if (!expenses || expenses.length === 0) {
                showEmptyState(
                    container,
                    'receipt',
                    'No Expenses Found',
                    'Add your first expense or adjust filters',
                    '<button class="btn btn-accent" onclick="openAddExpenseModal()"><i class="bi bi-plus-lg"></i> Add Expense</button>'
                );
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Vendor</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            expenses.forEach(expense => {
                html += `
                    <tr>
                        <td>${formatDate(expense.expense_date)}</td>
                        <td><strong>${expense.title}</strong></td>
                        <td>${getCategoryBadge({name: expense.category_name, color: expense.category_color, icon: expense.category_icon})}</td>
                        <td><span class="expense-amount">${formatCurrency(expense.amount)}</span></td>
                        <td><small class="text-muted">${expense.payment_method || '-'}</small></td>
                        <td><small class="text-muted">${expense.vendor || '-'}</small></td>
                        <td>${getStatusBadge(expense.status)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-icon btn-edit" onclick="editExpense(${expense.id})" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-icon btn-delete" onclick="deleteExpenseConfirm(${expense.id}, '${expense.title}')" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // Apply filters
        function applyFilters() {
            let filtered = [...allExpenses];
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            const categoryId = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            
            if (search) {
                filtered = filtered.filter(exp => 
                    exp.title.toLowerCase().includes(search) ||
                    (exp.description && exp.description.toLowerCase().includes(search)) ||
                    (exp.vendor && exp.vendor.toLowerCase().includes(search))
                );
            }
            
            if (categoryId) {
                filtered = filtered.filter(exp => exp.category_id == categoryId);
            }
            
            if (status) {
                filtered = filtered.filter(exp => exp.status === status);
            }
            
            updateQuickStats(filtered);
            displayExpenses(filtered);
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('statusFilter').value = '';
            
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            document.getElementById('startDateFilter').valueAsDate = firstDay;
            document.getElementById('endDateFilter').valueAsDate = lastDay;
            
            loadExpenses();
        }

        // Open add expense modal
        function openAddExpenseModal() {
            document.getElementById('expenseModalTitle').textContent = 'Add Expense';
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseId').value = '';
            document.getElementById('expenseDate').valueAsDate = new Date();
            expenseModal.show();
        }

        // Edit expense
        async function editExpense(id) {
            try {
                const expense = await fetchExpense(id);
                
                if (expense) {
                    document.getElementById('expenseModalTitle').textContent = 'Edit Expense';
                    document.getElementById('expenseId').value = expense.id;
                    document.getElementById('expenseTitle').value = expense.title;
                    document.getElementById('expenseAmount').value = expense.amount;
                    document.getElementById('expenseCategory').value = expense.category_id;
                    document.getElementById('expenseDate').value = expense.expense_date;
                    document.getElementById('expensePaymentMethod').value = expense.payment_method;
                    document.getElementById('expenseStatus').value = expense.status;
                    document.getElementById('expenseVendor').value = expense.vendor || '';
                    document.getElementById('expenseReference').value = expense.reference_number || '';
                    document.getElementById('expenseDescription').value = expense.description || '';
                    document.getElementById('expenseNotes').value = expense.notes || '';
                    
                    expenseModal.show();
                }
            } catch (error) {
                console.error('Error loading expense:', error);
                showNotification('Error loading expense', 'error');
            }
        }

        // Save expense
        async function saveExpense() {
            const form = document.getElementById('expenseForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const expenseData = {
                title: document.getElementById('expenseTitle').value,
                amount: parseFloat(document.getElementById('expenseAmount').value),
                category_id: document.getElementById('expenseCategory').value,
                expense_date: document.getElementById('expenseDate').value,
                payment_method: document.getElementById('expensePaymentMethod').value,
                status: document.getElementById('expenseStatus').value,
                vendor: document.getElementById('expenseVendor').value,
                reference_number: document.getElementById('expenseReference').value,
                description: document.getElementById('expenseDescription').value,
                notes: document.getElementById('expenseNotes').value
            };
            
            const expenseId = document.getElementById('expenseId').value;
            
            let result;
            if (expenseId) {
                result = await updateExpense(expenseId, expenseData);
            } else {
                result = await createExpense(expenseData);
            }
            
            if (result) {
                expenseModal.hide();
                loadExpenses();
            }
        }

        // Delete expense
        async function deleteExpenseConfirm(id, title) {
            if (confirmDelete(title)) {
                const result = await deleteExpense(id);
                if (result) {
                    loadExpenses();
                }
            }
        }

        // Export expenses
        function exportExpenses() {
            const filtered = allExpenses; // You can apply current filters here if needed
            exportToCSV(filtered, `expenses_${new Date().toISOString().split('T')[0]}.csv`);
        }
    </script>
